<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>knock-ocr</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#fff; --line:#e3e3df; --fg:#1c1c1a; --dim:#76766f;
  --accent:#3d6df0; --ok:#1a8a52; --warn:#b8730a; --err:#c0392b; --code:#f1f1ee;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#17171a;--panel:#1f1f23;--line:#33333a;--fg:#e8e8e4;--dim:#93939c;
        --accent:#7aa0ff;--ok:#4ec98a;--warn:#e0a44a;--err:#f0736a;--code:#26262c;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:13px}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
.bar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:14px 0 18px;
  padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.bar b{font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.on{background:var(--ok)} .dot.off{background:var(--err)} .dot.wait{background:var(--warn)}
#drop{border:1.5px dashed var(--line);border-radius:12px;background:var(--panel);
  padding:34px 20px;text-align:center;cursor:pointer;transition:.15s}
#drop:hover,#drop.hot{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
#drop h2{margin:0 0 6px;font-size:15px;font-weight:600}
#drop p{margin:0;color:var(--dim);font-size:12.5px}
.opts{display:flex;gap:18px;flex-wrap:wrap;margin:12px 2px;font-size:12.5px;color:var(--dim)}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.res{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:7px 14px;font-size:12.5px;border:0;background:none;color:var(--dim);
  cursor:pointer;border-radius:8px 8px 0 0}
.tab.on{color:var(--fg);background:var(--bg);font-weight:600}
.pane{padding:18px 22px;max-height:66vh;overflow:auto}
.pane[hidden]{display:none}
.meta{display:flex;gap:20px;flex-wrap:wrap;padding:10px 22px;font-size:12px;
  color:var(--dim);border-top:1px solid var(--line);background:var(--bg)}
pre{background:var(--code);padding:14px;border-radius:8px;overflow:auto;font-size:12.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0;white-space:pre-wrap;word-break:break-word}
.md h1,.md h2,.md h3{margin:1.2em 0 .5em;line-height:1.3}
.md h1{font-size:20px}.md h2{font-size:17px}.md h3{font-size:15px}
.md p{margin:.6em 0}
.md code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:12.5px}
.md table{border-collapse:collapse;margin:1em 0;font-size:13px;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.md th{background:var(--code);font-weight:600}
.md ul,.md ol{margin:.6em 0;padding-left:1.6em}
.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.err{color:var(--err);padding:16px 22px;font-size:13px;white-space:pre-wrap}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{margin-top:26px;color:var(--dim);font-size:12.5px}
.hint pre{margin-top:8px;background:var(--panel);border:1px solid var(--line)}
button.copy{float:right;font-size:11.5px;padding:3px 10px;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>knock-ocr</h1>
  <span class="sub" id="modelName">加载中…</span>
  <span class="badge">OmniDocBench v1.6 · 96.3%</span>
</header>

<div class="bar" id="statusBar"><span class="dot wait"></span>正在连接服务…</div>

<div id="drop">
  <h2>拖入图片或 PDF</h2>
  <p>也可以点击选择、或直接 Ctrl+V 粘贴截图 · png / jpg / webp / tiff / pdf</p>
  <input type="file" id="file" hidden accept=".png,.jpg,.jpeg,.bmp,.webp,.tif,.tiff,.pdf">
</div>

<div class="opts">
  <label><input type="checkbox" id="mergeTables" checked> 合并跨页表格</label>
  <label><input type="checkbox" id="includeJson" checked> 返回结构化 JSON</label>
</div>

<div class="res" id="res" hidden>
  <div class="tabs">
    <button class="tab on" data-p="render">渲染结果</button>
    <button class="tab" data-p="source">Markdown 源码</button>
    <button class="tab" data-p="json">结构化 JSON</button>
  </div>
  <div class="pane md" id="pane-render"></div>
  <div class="pane" id="pane-source" hidden><button class="copy" data-c="source">复制</button><pre id="srcText"></pre></div>
  <div class="pane" id="pane-json" hidden><button class="copy" data-c="json">复制</button><pre id="jsonText"></pre></div>
  <div class="meta" id="meta"></div>
</div>

<div class="hint">
  同一个能力的 API 调用方式：
  <pre>curl -F 'file=@page.png' http://<span id="host">…</span>/api/ocr</pre>
</div>

</div>
<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), fileInput = $('#file');
let last = null;

document.getElementById('host').textContent = location.host;

/* ---------- 极简 markdown 渲染：够看表格和标题，不引任何外部依赖 ---------- */
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
}
function renderMd(src){
  const lines = (src||'').split(/\r?\n/);
  const out = []; let i = 0;
  while(i < lines.length){
    const ln = lines[i];
    if(/^\s*$/.test(ln)){ i++; continue; }
    if(/^```/.test(ln)){
      const buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push('<pre>'+esc(buf.join('\n'))+'</pre>'); continue;
    }
    const h = ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const l=Math.min(h[1].length,3); out.push(`<h${l}>${inline(h[2])}</h${l}>`); i++; continue; }
    if(/^\s*([-*_])\1{2,}\s*$/.test(ln)){ out.push('<hr>'); i++; continue; }
    // 表格：| a | b |  紧跟分隔行
    if(/^\s*\|/.test(ln) && i+1<lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){
      const cells = r => r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
      const head = cells(ln); i += 2;
      const body = [];
      while(i<lines.length && /^\s*\|/.test(lines[i])) body.push(cells(lines[i++]));
      out.push('<table><thead><tr>' + head.map(c=>`<th>${inline(c)}</th>`).join('') +
        '</tr></thead><tbody>' +
        body.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('') +
        '</tbody></table>');
      continue;
    }
    if(/^\s*([-*+]|\d+\.)\s+/.test(ln)){
      const ol = /^\s*\d+\./.test(ln), items = [];
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i]))
        items.push(lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/,''));
      out.push(`<${ol?'ol':'ul'}>` + items.map(t=>`<li>${inline(t)}</li>`).join('') + `</${ol?'ol':'ul'}>`);
      continue;
    }
    const buf = [];
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^\s*[#|`]/.test(lines[i])) buf.push(lines[i++]);
    out.push('<p>'+inline(buf.join(' '))+'</p>');
  }
  return out.join('\n');
}

/* ---------- 状态 ---------- */
async function poll(){
  try{
    const r = await fetch('/api/info'); const d = await r.json();
    $('#modelName').textContent = d.model + ' · 版面分析 ' + d.layout_device;
    const vlm = d.vlm_backend || {};
    const pool = d.pool || {};
    const m = d.metrics || {};
    const ready = pool.ready > 0 && vlm.reachable;
    $('#statusBar').innerHTML =
      `<span><span class="dot ${vlm.reachable?'on':'off'}"></span>VLM 后端 <b>${vlm.reachable?'在线':'离线'}</b></span>` +
      `<span><span class="dot ${ready?'on':'wait'}"></span>流水线 <b>${pool.ready}/${pool.size}</b>（空闲 ${pool.idle}）</span>` +
      `<span>累计 <b>${m.total||0}</b> 次` + (m.failed ? ` · 失败 ${m.failed}` : '') + `</span>` +
      (m.p50_ms ? `<span>P50 <b>${m.p50_ms}</b>ms · P95 <b>${m.p95_ms}</b>ms</span>` : '');
  }catch(e){
    $('#statusBar').innerHTML = '<span class="dot off"></span>无法连接服务';
  }
}
poll(); setInterval(poll, 4000);

/* ---------- 上传 ---------- */
drop.onclick = () => fileInput.click();
fileInput.onchange = e => e.target.files[0] && send(e.target.files[0]);
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e=>{e.preventDefault();drop.classList.add('hot');}));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e=>{e.preventDefault();drop.classList.remove('hot');}));
drop.addEventListener('drop', e => e.dataTransfer.files[0] && send(e.dataTransfer.files[0]));
window.addEventListener('paste', e => {
  for(const it of e.clipboardData.items){
    if(it.type.startsWith('image/')){ send(it.getAsFile()); break; }
  }
});

async function send(f){
  $('#res').hidden = false;
  show('render');
  $('#pane-render').innerHTML = `<p><span class="spin"></span> 正在识别 <b>${f.name||'粘贴的图片'}</b>（${(f.size/1024).toFixed(0)} KB）…</p>`;
  $('#meta').textContent = '';
  const fd = new FormData(); fd.append('file', f, f.name || 'paste.png');
  const qs = `?merge_tables=${$('#mergeTables').checked}&include_json=${$('#includeJson').checked}`;
  const t0 = performance.now();
  try{
    const r = await fetch('/api/ocr' + qs, {method:'POST', body:fd});
    const txt = await r.text();
    if(!r.ok){
      let msg = txt; try{ msg = JSON.parse(txt).detail || txt; }catch(_){}
      $('#pane-render').innerHTML = `<div class="err">${esc(String(msg))}</div>`;
      return;
    }
    const d = JSON.parse(txt); last = d;
    $('#pane-render').innerHTML = renderMd(d.markdown) || '<p style="color:var(--dim)">未识别到内容</p>';
    $('#srcText').textContent = d.markdown || '';
    $('#jsonText').textContent = JSON.stringify(d.result ?? {}, null, 2);
    const chars = (d.markdown||'').length;
    $('#meta').innerHTML =
      `<span>页数 <b>${d.pages}</b></span>` +
      `<span>服务端 <b>${d.elapsed_ms}</b> ms</span>` +
      `<span>端到端 <b>${(performance.now()-t0).toFixed(0)}</b> ms</span>` +
      `<span>字符 <b>${chars}</b></span>` +
      `<span style="color:var(--dim)">${d.request_id}</span>`;
    poll();
  }catch(err){
    $('#pane-render').innerHTML = `<div class="err">请求失败：${esc(String(err))}</div>`;
  }
}

/* ---------- tabs ---------- */
function show(name){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.p===name));
  ['render','source','json'].forEach(p => $('#pane-'+p).hidden = (p!==name));
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => show(b.dataset.p));
document.querySelectorAll('.copy').forEach(b => b.onclick = async ev => {
  ev.stopPropagation();
  const t = b.dataset.c === 'source' ? $('#srcText').textContent : $('#jsonText').textContent;
  try{ await navigator.clipboard.writeText(t); b.textContent='已复制'; setTimeout(()=>b.textContent='复制',1200); }
  catch(_){ b.textContent='复制失败'; setTimeout(()=>b.textContent='复制',1200); }
});
</script>
</body>
</html>
